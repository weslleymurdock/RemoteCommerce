name: build

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
    tags: ['v*'] 
  workflow_dispatch:
   
permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: ${{ github.workspace }}/global.json

    - name: Remote Commerce
      run: |
        dotnet restore RemoteCommerce.slnx
        dotnet build RemoteCommerce.slnx --configuration Release --no-restore
        dotnet test RemoteCommerce.slnx --configuration Release --no-build --no-restore
    
    - name: Plugins
      run: |
        dotnet restore RemoteCommerce.Plugins.slnx
        dotnet build RemoteCommerce.Plugins.slnx --configuration Release --no-restore
        dotnet build RemoteCommerce.Plugins.slnx --configuration Release --no-restore
        dotnet pack plugins/Sample/RemoteCommerce.SamplePlugin/Plugin.csproj --configuration Release --no-restore --output ./artifacts
        
    - name: Tools
      run: |
        dotnet restore RemoteCommerce.Tools.slnx 
        dotnet build RemoteCommerce.Tools.slnx --configuration Release --no-restore
        dotnet pack tools/RemoteCommerce.Plugin.Template/RemoteCommerce.Plugin.Template.csproj --configuration Release --no-restore --output ./artifacts
    
    - name: Validate plugin package
      shell: bash
      run: test -f ./artifacts/RemoteCommerce_SamplePlugin.1.0.0.nupkg
    - name: Validate dotnet tool package
      shell: bash
      run: test -f ./artifacts/RemoteCommerce.Plugin.Template.1.0.0.nupkg
  
  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ github.workspace }}/global.json

      - name: Download packed tools
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: NuGet login (OIDC) and package push
        id: login 
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        with:
          user: ${{ env.USERNAME }}  
        env:
          USERNAME: ${{ secrets.USER_NAME }}

      - name: Publish Dotnet Tools & Packages to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate