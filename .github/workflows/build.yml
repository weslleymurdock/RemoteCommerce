name: build

on:
  push:
    branches: [main, 'stage/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore RemoteCommerce.sln
      - run: dotnet build RemoteCommerce.sln --configuration Release --no-restore
