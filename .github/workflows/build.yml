name: Continuous Integration-Testing-Delivery

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ github.workspace }}/global.json

      - name: Restore RemoteCommerce
        run: dotnet restore RemoteCommerce.slnx

      - name: Build RemoteCommerce
        run: dotnet build RemoteCommerce.slnx --configuration Release --no-restore

      - name: Restore plugins
        run: dotnet restore RemoteCommerce.Plugins.slnx

      - name: Build plugins
        run: dotnet build RemoteCommerce.Plugins.slnx --configuration Release --no-restore

      - name: Pack sample plugin
        run: dotnet pack plugins/Sample/RemoteCommerce.SamplePlugin/Plugin.csproj --configuration Release --no-restore --output ./artifacts

      - name: Restore tools
        run: dotnet restore RemoteCommerce.Tools.slnx

      - name: Build tools
        run: dotnet build RemoteCommerce.Tools.slnx --configuration Release --no-restore

      - name: Pack plugin template tool
        run: dotnet pack tools/RemoteCommerce.Plugin.Template/RemoteCommerce.Plugin.Template.csproj --configuration Release --no-restore --output ./artifacts

      - name: Validate plugin package
        shell: bash
        run: test -f ./artifacts/RemoteCommerce_SamplePlugin.1.0.0.nupkg

      - name: Validate dotnet tool package
        shell: bash
        run: test -f ./artifacts/RemoteCommerce.Plugin.Template.1.0.0.nupkg

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error

  tests:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ github.workspace }}/global.json

      - name: Restore RemoteCommerce tests
        run: dotnet restore RemoteCommerce.slnx

      - name: Run tests with coverage
        run: |
          dotnet test RemoteCommerce.slnx \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./TestResults/coverage.cobertura.xml
        continue-on-error: true

      - name: Publish Test Summary
        uses: dorny/test-reporter@v1
        if: always() 
        with:
          name: 'xUnit v3 Test Results'
          path: 'TestResults/*.trx'
          reporter: 'dotnet-trx'

      - name: Generate Coverage Markdown Report
        if: always()
        run: |
          dotnet tool run reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"MarkdownSummaryGithub"

      - name: Append Coverage Summary to Job
        if: always()
        run: |
          if [ -f ./TestResults/CoverageReport/SummaryGithub.md ]; then
            echo "## 📊 Code Coverage Report." >> $GITHUB_STEP_SUMMARY
            cat ./TestResults/CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Code Coverage Report Not found/generated." >> $GITHUB_STEP_SUMMARY
          fi

  publish:
    needs: [tests]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ github.workspace }}/global.json

      - name: Download packed tools and plugins
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: NuGet login (OIDC) and package push
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ env.USERNAME }}
        env:
          USERNAME: ${{ secrets.USER_NAME }}

      - name: Publish Dotnet Tools and Packages to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
